<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Syntaxer{% endblock %} — Python to Java</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --card: #12121a;
  --card2: #1a1a26;
  --border: #2a2a3e;
  --accent: #7c6af7;
  --accent2: #a78bfa;
  --text: #e2e2f0;
  --muted: #6b7280;
  --easy: #10b981;
  --medium: #f59e0b;
  --hard: #ef4444;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; min-height: 100vh; }
a { color: var(--accent2); text-decoration: none; }
a:hover { color: #fff; }

/* NAVBAR */
.navbar { background: rgba(10,10,15,0.95); border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); padding: 12px 0; position: sticky; top: 0; z-index: 100; }
.navbar-brand { font-size: 1.4rem; font-weight: 800; }
.navbar-brand span { color: var(--accent); }
.search-input { background: var(--card2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 14px; width: 260px; font-size: 14px; transition: all .2s; }
.search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,106,247,.15); }
.search-input::placeholder { color: var(--muted); }
.nav-link { color: var(--muted) !important; font-size: 14px; font-weight: 500; padding: 6px 12px !important; border-radius: 6px; transition: all .2s; }
.nav-link:hover, .nav-link.active { color: var(--text) !important; background: var(--card2); }

/* DIFF BADGES */
.badge-easy { background: rgba(16,185,129,.15); color: var(--easy); border: 1px solid rgba(16,185,129,.3); border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 600; }
.badge-medium { background: rgba(245,158,11,.15); color: var(--medium); border: 1px solid rgba(245,158,11,.3); border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 600; }
.badge-hard { background: rgba(239,68,68,.15); color: var(--hard); border: 1px solid rgba(239,68,68,.3); border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 600; }

/* CARDS */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; transition: all .2s; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(124,106,247,.15); }

/* FOOTER */
footer { border-top: 1px solid var(--border); padding: 20px 0; margin-top: 60px; color: var(--muted); font-size: 13px; }

/* CODE */
pre[class*="language-"] { border-radius: 8px; font-size: 13px; margin: 0; }
pre { background: #0d1117 !important; border: 1px solid var(--border); border-radius: 8px; }

/* ANIMATIONS */
@keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn .4s ease both; }
.fade-in-1 { animation-delay: .05s; }
.fade-in-2 { animation-delay: .1s; }
.fade-in-3 { animation-delay: .15s; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar">
  <div class="container d-flex align-items-center gap-3">
    <a class="navbar-brand" href="/"><span>Syn</span>taxer</a>
    <div class="flex-grow-1"></div>
    <form action="/search" method="get">
      <input class="search-input" type="text" name="q" placeholder="Search problems..." value="{{ request.args.get('q','') }}">
    </form>
    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a>
    <a class="nav-link {% if request.path == '/glossary' %}active{% endif %}" href="/glossary">Glossary</a>
  </div>
</nav>

{% block content %}{% endblock %}

<footer>
  <div class="container text-center">
    <span>Syntaxer — Python ➜ Java Syntax Bridge &nbsp;·&nbsp; {{ total_problems }} problems across {{ categories|length }} categories</span>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
